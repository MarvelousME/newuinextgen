# NextGen Tutors — local WordPress (newuinextgen workspace)
# Usage:
#   cd docker
#   copy .env.example .env
#   .\start.ps1

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --ssl=0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  wordpress:
    image: wordpress:6.7-php8.2-apache
    restart: unless-stopped
    ports:
      - "${WP_PORT:-8900}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('FS_METHOD', 'direct');
        define('WP_HTTP_BLOCK_EXTERNAL', false);
        define('WP_ACCESSIBLE_HOSTS', 'api.wordpress.org,downloads.wordpress.org,wordpress.org,*.wordpress.org');
        define('NGC_ALLOW_DEMO_SEED', true);
        define('NGCPM_LOCAL_ZIP_DIR', '/var/www/html/wp-content/ngcpm-packages');
    volumes:
      - wp_data:/var/www/html
      - ./hello-elementor:/var/www/html/wp-content/themes/hello-elementor
      # Theme-only package + explicit dir binds (Windows junctions are not followed in Linux containers).
      - ../NextGenTutors-BeyondInfinity:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity
      - ../assets:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/assets
      - ../inc:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/inc
      - ../templates:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/templates
      - ../template-parts:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/template-parts
      - ../page-templates:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/page-templates
      - ../prototypes:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/prototypes
      - ../content:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/content
      - ../automations:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/automations
      - ../tests:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/tests
      - ../agntix/agntix-child:/var/www/html/wp-content/themes/agntix-child
      - ${COMPANION_PLUGIN_PATH:-../NextGenTutors-Companion}:/var/www/html/wp-content/plugins/NextGenTutors-Companion
      - ../nextgen-automation-hub:/var/www/html/wp-content/plugins/nextgen-automation-hub
      - ../NextGenTutors-Plugin-Manager:/var/www/html/wp-content/plugins/NextGenTutors-Plugin-Manager
      - ../NextGenTutors-Html-Importer:/var/www/html/wp-content/plugins/NextGenTutors-Html-Importer
      - ../content/_extracted/nextgen-command-center-v1.0:/var/www/html/wp-content/plugins/nextgen-command-center
      - ../content/_extracted/nextgen-completion-suite:/var/www/html/wp-content/plugins/nextgen-completion-suite
      - ../webpages-content:/var/www/html/wp-content/ngt-html-source
      - ../ui-library:/var/www/html/wp-content/ngt-ui-library
      - ./ngcpm-packages:/var/www/html/wp-content/ngcpm-packages
      - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      db:
        condition: service_healthy

  wpcli:
    profiles:
      - setup
    image: wordpress:cli-php8.2
    environment:
      MYSQL_SSL_MODE: DISABLED
      WP_URL: ${WP_URL:-http://localhost:8900}
      WP_TITLE: ${WP_TITLE:-NextGen Tutors}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-NextGenAdmin!2026}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@nextgentutors.local}
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('NGC_ALLOW_DEMO_SEED', true);
    volumes:
      - wp_data:/var/www/html
      - ./hello-elementor:/var/www/html/wp-content/themes/hello-elementor
      - ../NextGenTutors-BeyondInfinity:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity
      - ../assets:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/assets
      - ../inc:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/inc
      - ../templates:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/templates
      - ../template-parts:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/template-parts
      - ../page-templates:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/page-templates
      - ../prototypes:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/prototypes
      - ../content:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/content
      - ../automations:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/automations
      - ../tests:/var/www/html/wp-content/themes/nextgentutors-beyondinfinity/tests
      - ../agntix/agntix-child:/var/www/html/wp-content/themes/agntix-child
      - ${COMPANION_PLUGIN_PATH:-../NextGenTutors-Companion}:/var/www/html/wp-content/plugins/NextGenTutors-Companion
      - ../nextgen-automation-hub:/var/www/html/wp-content/plugins/nextgen-automation-hub
      - ../NextGenTutors-Plugin-Manager:/var/www/html/wp-content/plugins/NextGenTutors-Plugin-Manager
      - ../NextGenTutors-Html-Importer:/var/www/html/wp-content/plugins/NextGenTutors-Html-Importer
      - ../content/_extracted/nextgen-command-center-v1.0:/var/www/html/wp-content/plugins/nextgen-command-center
      - ../content/_extracted/nextgen-completion-suite:/var/www/html/wp-content/plugins/nextgen-completion-suite
      - ../webpages-content:/var/www/html/wp-content/ngt-html-source
      - ../ui-library:/var/www/html/wp-content/ngt-ui-library
      - ./ngcpm-packages:/var/www/html/wp-content/ngcpm-packages
      - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - ./init/setup.sh:/setup/setup.sh:ro
      - ./init/apply-defaults.sh:/setup/apply-defaults.sh:ro
      - ./init/install-plugins.sh:/setup/install-plugins.sh:ro
      - ./init/install-registry-zips.sh:/setup/install-registry-zips.sh:ro
      - ./init/install-companion.sh:/setup/install-companion.sh:ro
      - ./init/install-wpbakery.sh:/setup/install-wpbakery.sh:ro
      - ./ngt-ui-smoke.php:/tmp/ngt-ui-smoke.php:ro
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    entrypoint: ["/bin/sh", "/setup/setup.sh"]

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    # SEC-001: bind to loopback only — not reachable from LAN/WAN. Set PMA_BIND=0.0.0.0 only on trusted hosts.
    ports:
      - "${PMA_BIND:-127.0.0.1}:${PMA_PORT:-8082}:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER:-wordpress}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  wp_data:
