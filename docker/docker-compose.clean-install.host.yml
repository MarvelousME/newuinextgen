# Host-network clean-room WordPress for environments where Docker bridge
# networking is blocked (common in nested/cloud VMs). Same PRODUCTION ZIPs.
# Site: http://127.0.0.1:8999  DB: 127.0.0.1:3307

name: ngt-clean-install

services:
  db:
    image: mysql:8.0
    network_mode: host
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --ssl=0
      - --port=3307
      - --bind-address=127.0.0.1
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_TCP_PORT: "3307"
    volumes:
      - clean_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3307", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 25s

  wordpress:
    image: wordpress:php8.2-apache
    network_mode: host
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: 127.0.0.1:3307
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('FS_METHOD', 'direct');
        define('NGC_ALLOW_DEMO_SEED', true);
    volumes:
      - clean_wp:/var/www/html
      - ../PRODUCTION/01-INSTALLABLE-PACKAGES:/packages:ro
      - ./apache-8999.conf:/etc/apache2/ports.conf:ro
      - ./apache-8999-site.conf:/etc/apache2/sites-enabled/000-default.conf:ro
    depends_on:
      db:
        condition: service_healthy

  wpcli:
    profiles:
      - setup
    image: wordpress:cli-php8.2
    network_mode: host
    environment:
      WP_URL: http://127.0.0.1:8999
      WP_TITLE: NextGen Tutors Clean Install
      WP_ADMIN_USER: admin
      WP_ADMIN_PASSWORD: NextGenAdmin!2026
      WP_ADMIN_EMAIL: admin@nextgentutors.local
      WORDPRESS_DB_HOST: 127.0.0.1:3307
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - clean_wp:/var/www/html
      - ../PRODUCTION/01-INSTALLABLE-PACKAGES:/packages:ro
      - ./init/clean-install.sh:/setup/clean-install.sh:ro
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    user: "0:0"
    entrypoint: ["/bin/sh", "/setup/clean-install.sh"]

volumes:
  clean_db:
  clean_wp:
