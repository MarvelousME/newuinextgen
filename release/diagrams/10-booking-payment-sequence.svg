<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img">
  <title>10 - Booking and Payment Sequence</title>
  <desc>Booking creation through WooCommerce checkout and PayFast ITN into Companion ledger.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0D7377"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F7FBFC"/>
  <text x="24" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B2545">10 - Booking / Payment Sequence</text>
  <text x="80" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">Parent</text>
  <text x="240" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">Booking</text>
  <text x="420" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">WooCommerce</text>
  <text x="620" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">PayFast</text>
  <text x="820" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">Companion</text>
  <line x1="80" y1="90" x2="80" y2="420" stroke="#0B2545" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="240" y1="90" x2="240" y2="420" stroke="#0B2545" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="420" y1="90" x2="420" y2="420" stroke="#0B2545" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="620" y1="90" x2="620" y2="420" stroke="#0B2545" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="820" y1="90" x2="820" y2="420" stroke="#0B2545" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="80" y1="130" x2="240" y2="130" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="160" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">1 select slot</text>
  <line x1="240" y1="180" x2="820" y2="180" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="520" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">2 create booking record</text>
  <line x1="240" y1="230" x2="420" y2="230" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="330" y="222" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">3 checkout</text>
  <line x1="420" y1="280" x2="620" y2="280" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="520" y="272" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">4 redirect pay</text>
  <line x1="620" y1="340" x2="820" y2="340" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="720" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">5 ITN (idempotent)</text>
  <line x1="820" y1="390" x2="80" y2="390" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="450" y="382" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">6 confirm + ledger / notify</text>
  <rect x="40" y="450" width="620" height="55" rx="4" fill="#FFFFFF" stroke="#0B2545"/>
  <text x="50" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5A6A7A">Legend: PayFast secrets OPEN (never in package). Live ITN UNVERIFIED this session.</text>
  <text x="50" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5A6A7A">Amelia adapter PARTIAL if plugin missing. Demo forces sandbox.</text>
</svg>
