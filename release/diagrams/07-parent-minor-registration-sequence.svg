<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img">
  <title>07 - Parent Minor Registration Sequence</title>
  <desc>Sequence for parent registration and linking a minor learner under guardian accountability.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0D7377"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#F7FBFC"/>
  <text x="24" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0B2545">07 - Parent / Minor Registration Sequence</text>
  <text x="100" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">Parent</text>
  <text x="300" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">Theme / Forms</text>
  <text x="520" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">Companion</text>
  <text x="740" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">WP Users / Roles</text>
  <line x1="100" y1="90" x2="100" y2="420" stroke="#0B2545" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="300" y1="90" x2="300" y2="420" stroke="#0B2545" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="520" y1="90" x2="520" y2="420" stroke="#0B2545" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="740" y1="90" x2="740" y2="420" stroke="#0B2545" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="100" y1="120" x2="300" y2="120" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="200" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">1 open register</text>
  <line x1="300" y1="160" x2="520" y2="160" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="410" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">2 submit parent form</text>
  <line x1="520" y1="200" x2="740" y2="200" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="630" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">3 create ngt_parent</text>
  <line x1="520" y1="250" x2="300" y2="250" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="410" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">4 confirm / dashboard</text>
  <line x1="100" y1="300" x2="520" y2="300" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="300" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">5 add learner (minor)</text>
  <line x1="520" y1="350" x2="740" y2="350" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="630" y="342" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">6 link ngt_student + NGT-S</text>
  <line x1="520" y1="400" x2="100" y2="400" stroke="#0D7377" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="310" y="392" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#14919B">7 guardian remains accountable</text>
  <rect x="40" y="450" width="500" height="45" rx="4" fill="#FFFFFF" stroke="#0B2545"/>
  <text x="50" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5A6A7A">Legend: arrows = request flow. Safeguarding / privacy rules apply to minor PII.</text>
  <text x="50" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5A6A7A">Runtime completeness PARTIAL until headed verify on target host.</text>
</svg>
