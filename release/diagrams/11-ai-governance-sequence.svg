  <text x="100" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">Ops / AI Ops</text>
  <text x="300" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">AI Integration</text>
  <text x="520" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">Companion AI</text>
  <text x="740" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B2545">Provider (BYOK)</text>
  <line x1="100" y1="90" x2="100" y2="400" stroke="#0B2545" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="300" y1="90" x2="300" y2="400" stroke="#0B2545" stroke-width="1" stroke-dasharray="4 3"/>
